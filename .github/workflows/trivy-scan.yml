name: Scan de sécurité (Trivy)

# Shift left : les images et les manifests sont analysés à chaque commit,
# pas au moment de la mise en production.
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Une image inchangée devient vulnérable avec le temps : re-scan hebdomadaire.
    - cron: "0 6 * * 1"

permissions:
  contents: read

jobs:
  image-vulnerable:
    name: Image vulnérable (constat, non bloquant)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build node-vulnerable
        run: docker build -t node-vulnerable -f trivy/Dockerfile.vulnerable trivy/

      - name: Scan node-vulnerable
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: node-vulnerable
          scanners: vuln
          format: table
          exit-code: "0" # on veut voir le rapport, pas casser le job

  image-fixed:
    name: Image corrigée (bloquant)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build node-fixed
        run: docker build --no-cache -t node-fixed -f trivy/Dockerfile.fixed trivy/

      # Porte de sécurité sur la couche système, qui est ce que corrige le Dockerfile.
      - name: Paquets système (bloquant)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: node-fixed
          scanners: vuln
          vuln-type: os
          severity: CRITICAL,HIGH
          ignore-unfixed: true # inutile de bloquer sur ce qui n'a pas de correctif
          format: table
          exit-code: "1" # le job échoue si une faille corrigeable subsiste

      # Les dépendances npm embarquées dans l'image officielle restent vulnérables :
      # changer d'image de base ne les corrige pas. Constat affiché, pas encore bloquant.
      - name: Dépendances applicatives (constat)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: node-fixed
          scanners: vuln
          vuln-type: library
          severity: CRITICAL,HIGH
          format: table
          exit-code: "0"

  manifests:
    name: Manifests Kubernetes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Scan des erreurs de configuration
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: config
          scan-ref: app
          severity: CRITICAL,HIGH
          format: table
          exit-code: "0" # à passer à 1 une fois les manifests durcis
