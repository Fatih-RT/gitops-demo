# TP1 - Application creee en CLI (`argocd app create guestbook-cli ...`), ici en version declarative.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: guestbook-cli
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/argoproj/argocd-example-apps.git
    targetRevision: HEAD
    path: guestbook
  destination:
    server: https://kubernetes.default.svc
    namespace: guestbook-cli
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
