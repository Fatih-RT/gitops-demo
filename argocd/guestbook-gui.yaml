# TP1 - Application creee dans l'interface graphique, ici en version declarative.
# Sync policy Manual, conformement a l'enonce.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: guestbook-gui
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/argoproj/argocd-example-apps.git
    targetRevision: HEAD
    path: guestbook
  destination:
    server: https://kubernetes.default.svc
    namespace: guestbook-gui
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
