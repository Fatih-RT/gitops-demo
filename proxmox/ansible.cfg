[defaults]
inventory = inventory.ini
# Le callback yaml de community.general a été retiré : c'est désormais une
# option du callback par défaut.
result_format = yaml
# Les scripts du TP1 durent une vingtaine de minutes : garder la connexion ouverte.
timeout = 60

[ssh_connection]
pipelining = True
ssh_args = -o ControlMaster=auto -o ControlPersist=30m -o StrictHostKeyChecking=accept-new
